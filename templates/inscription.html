<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription Client - Enjoy</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
}

/* Fond animé identique à l'accueil */
.background-animation {
    position: fixed;  
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

/* Formes flottantes */
.floating-shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.1;
    animation: float 20s infinite ease-in-out;
}

.shape1 { width: 300px; height: 300px; background: #fff; top: 10%; left: 10%; animation-delay: 0s; }
.shape2 { width: 200px; height: 200px; background: #ffd700; top: 60%; right: 15%; animation-delay: 3s; }
.shape3 { width: 150px; height: 150px; background: #ff6b6b; bottom: 20%; left: 20%; animation-delay: 6s; }
.shape4 { width: 250px; height: 250px; background: #4ecdc4; top: 40%; right: 30%; animation-delay: 9s; }

@keyframes float {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    25% { transform: translate(30px,-30px) rotate(90deg); }
    50% { transform: translate(-20px,20px) rotate(180deg); }
    75% { transform: translate(40px,10px) rotate(270deg); }
}

/* Header fixe */
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    z-index: 10;
    background: transparent;
}

.header-logo {
    height: 50px;
    width: auto;
}

/* Navigation compacte */
nav {
    margin: 70px auto 20px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    padding: 10px 0;
    border-radius: 25px;
    max-width: 800px;
    display: flex;
    justify-content: center;
    gap: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

nav a {
    margin: 0 10px;
    text-decoration: none;
    color: #333;
    font-weight: 600;
    font-size: 0.9em;
    position: relative;
    transition: all 0.3s ease;
}

nav a::after {
    content: '';
    position: absolute;
    bottom: -3px;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    transition: width 0.3s ease;
}

nav a:hover { 
    color: #667eea; 
    transform: translateY(-2px); 
}

nav a:hover::after { 
    width: 100%; 
}

/* Conteneur principal */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    position: relative;
    z-index: 1;
    padding-top: 130px;
}

/* Conteneur d'inscription */
.form-container {
    width: 100%;
    max-width: 450px;
    margin: 40px auto;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    padding: 50px 40px;
    border-radius: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: fadeInUp 1s ease-out;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.form-container h2 {
    text-align: center;
    color: #333;
    font-size: 2em;
    margin-bottom: 30px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* Groupes de formulaire */
.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #555;
    font-weight: 600;
    font-size: 0.95em;
}

.form-group input {
    width: 100%;
    padding: 15px 20px;
    border: 2px solid #e0e0e0;
    border-radius: 15px;
    font-size: 1em;
    transition: all 0.3s ease;
    background: white;
}

.form-group input:focus {
    border-color: #667eea;
    outline: none;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
}

.form-group input::placeholder {
    color: #aaa;
}

/* Bouton d'inscription - VIOLET */
button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 15px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
    margin-top: 10px;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
}

button:active {
    transform: translateY(0);
}

/* Lien de connexion */
.login-link {
    text-align: center;
    margin-top: 25px;
    font-size: 0.95em;
    color: #666;
}

.login-link a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
}

.login-link a:hover {
    color: #764ba2;
    text-decoration: underline;
}

/* Icône d'inscription */
.register-icon {
    text-align: center;
    font-size: 4em;
    margin-bottom: 20px;
}

/* Responsive */
@media (max-width: 768px) {
    .header-logo { 
        height: 40px; 
    }
    
    nav { 
        margin: 60px auto 20px; 
        padding: 8px 0; 
        border-radius: 20px; 
        flex-wrap: wrap;
    }
    
    nav a { 
        font-size: 0.85em; 
    }
    
    .form-container {
        padding: 40px 30px;
        margin: 20px auto;
    }
    
    .form-container h2 {
        font-size: 1.6em;
    }
}
</style>
</head>
<body>

<!-- Fond animé -->
<div class="background-animation">
    <div class="floating-shape shape1"></div>
    <div class="floating-shape shape2"></div>
    <div class="floating-shape shape3"></div>
    <div class="floating-shape shape4"></div>
</div>

<div class="container">
    <!-- Navigation compacte -->
    <nav>
        <a href="accueil">Accueil</a>
        <a href="recherche">Recherche</a>
        <a href="connexion">Espace client</a>
        <a href="connexionprive">Espace livreur</a>
        <a href="commentaire_verifie">Commentaires vérifiés</a>
    </nav>
    
    <!-- Formulaire d'inscription -->
    <div class="form-container">
        <div class="register-icon"></div>
        <h2>Créer un compte</h2>
        
        <form action="{{ url_for('inscription') }}" method="POST">
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" name="nom" placeholder="Votre nom" required>
            </div>
            
            <div class="form-group">
                <label for="prenom">Prénom</label>
                <input type="text" name="prenom" placeholder="Votre prénom" required>
            </div>
            
            <div class="form-group">
                <label for="mail">Email</label>
                <input type="email" name="mail" placeholder="votre.email@exemple.com" required>
            </div>
            
            <div class="form-group">
                <label for="mdp">Mot de passe</label>
                <input type="password" name="mdp" placeholder="Minimum 6 caractères" required>
            </div>
            
            <button type="submit">Créer mon compte</button>
        </form>
        
        <div class="login-link">
            Déjà un compte ? <a href="{{ url_for('connexion') }}">Connectez-vous</a>
        </div>
    </div>
</div>

</body>
</html>
